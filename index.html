<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Access Gate</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
    margin: 0;
    min-height: 100vh;
    background: #0b0e14;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    color: #eaeaea;
}

.box-3d {
    width: 94%;
    max-width: 430px;
    background: linear-gradient(160deg, #1a1f2b, #0f1320);
    border-radius: 18px;
    padding: 18px;
    box-shadow:
        0 35px 70px rgba(0,0,0,0.85),
        inset 0 0 0 1px rgba(255,255,255,0.05);
}

.inner-core {
    background: radial-gradient(circle at top, #0d1220, #070a12);
    border-radius: 14px;
    padding: 22px;
    box-shadow:
        inset 0 8px 20px rgba(0,0,0,0.9),
        inset 0 -1px 0 rgba(255,255,255,0.05);
}

h1 {
    font-size: 20px;
    margin-bottom: 6px;
    letter-spacing: 1px;
}

.subtitle {
    font-size: 12px;
    opacity: 0.6;
    margin-bottom: 22px;
}

.task {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px;
    margin-bottom: 14px;
    border-radius: 12px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 6px 18px rgba(0,0,0,0.6);
}

.task-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.icon {
    width: 22px;
    height: 22px;
    stroke: #5cc8ff;
    fill: none;
    stroke-width: 1.6;
}

.task span {
    font-size: 13px;
    font-weight: 500;
}

.task button {
    padding: 6px 14px;
    border-radius: 10px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    color: #081018;
    background: linear-gradient(135deg, #5cc8ff, #3a7dff);
    transition: 0.25s;
}

.task button:hover {
    box-shadow: 0 0 18px rgba(92,200,255,0.45);
}

.task button.done {
    background: #1f3d2b;
    color: #8fffd2;
    cursor: default;
    box-shadow: none;
}

.download a {
    display: block;
    margin-top: 18px;
    padding: 15px;
    border-radius: 14px;
    text-align: center;
    text-decoration: none;
    font-weight: 700;
    letter-spacing: 1px;
    background: #2a2f3d;
    color: #555;
    pointer-events: none;
}

.download a.active {
    background: linear-gradient(135deg, #00ffd0, #4cc3ff);
    color: #041014;
    pointer-events: auto;
    box-shadow: 0 0 30px rgba(0,255,208,0.4);
}

.footer {
    text-align: center;
    margin-top: 14px;
    font-size: 10px;
    opacity: 0.35;
}
</style>
</head>
<body>

<div class="box-3d">
<div class="inner-core">

<h1>DOWNLOAD APK ONX-1</h1>
<div class="subtitle">silahkan ikuti midia kami untik mendownload apk</div>

<!-- TikTok -->
<div class="task">
    <div class="task-left">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M9 3v12a3 3 0 1 1-2-2.83"/>
            <path d="M9 3c1.5 2.5 3.5 4 6 4"/>
        </svg>
        <span>TikTok ONEDEV</span>
    </div>
    <button onclick="done(this,'tt')">Follow</button>
</div>

<!-- Channel 1 -->
<div class="task">
    <div class="task-left">
        <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="14" rx="2"/>
            <path d="M3 6l9 6 9-6"/>
        </svg>
        <span>WhatsApp Channel</span>
    </div>
    <button onclick="done(this,'ch')">Follow</button>
</div>

<!-- Channel 2 -->
<div class="task">
    <div class="task-left">
        <svg class="icon" viewBox="0 0 24 24">
            <rect x="3" y="4" width="18" height="14" rx="2"/>
            <path d="M7 10h10"/>
        </svg>
        <span>Channel2</span>
    </div>
    <button onclick="done(this,'ch2')">Folow</button>
</div>

<!-- WA Group -->
<div class="task">
    <div class="task-left">
        <svg class="icon" viewBox="0 0 24 24">
            <path d="M20 11a8 8 0 1 1-15 3l-1 5 5-1a8 8 0 0 1 11-7z"/>
        </svg>
        <span>WhatsApp Group</span>
    </div>
    <button onclick="done(this,'wa')">Join</button>
</div>

<div class="download">
    <a id="dl" href="https://www.mediafire.com/file/m2bdenfx0eldzp6/SCYBER_ONXV1_1.0.apk/file" target="_blank">
        DOWNLOAD FILE
    </a>
</div>

<div class="footer">OneDev Secure System</div>

</div>
</div>

<script>
const state = { tt:false, ch:false, ch2:false, wa:false };

function done(btn,key){
    if(state[key]) return;
    state[key] = true;
    btn.textContent = "DONE";
    btn.classList.add("done");

    if(key==='tt') window.open("https://vm.tiktok.com/ZS9Ys5bAmveQ9-RlpSn/","_blank");
    if(key==='ch') window.open("https://whatsapp.com/channel/0029Vb6o7sgGU3BKw965Ti0o","_blank");
    if(key==='ch2') window.open("https://whatsapp.com/channel/0029VbCPdLJD8SDw4Zm4hH2e/181","_blank");
    if(key==='wa') window.open("https://chat.whatsapp.com/DE5vRiOeEf61IvZLAFwHTM?mlu=0&s=cl&p=a","_blank");

    if(state.tt && state.ch && state.ch2 && state.wa){
        document.getElementById("dl").classList.add("active");
    }
}
</script>

</body>
</html>
